<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Quota Hire - Info Email Signature</title>
  <!--[if mso]>
  <style type="text/css">
    table, td, div, p, a, span { font-family: Arial, sans-serif !important; }
  </style>
  <![endif]-->
  <style>
    @media only screen and (max-width: 520px) {
      .sig-column {
        display: block !important;
        width: 100% !important;
        box-sizing: border-box !important;
        padding-right: 0 !important;
        padding-left: 0 !important;
        padding-bottom: 8px !important;
        border-left: none !important;
      }
      .sig-align-right {
        text-align: left !important;
        padding-top: 4px !important;
      }
    }
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #ffffff; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%;">
  
  <!-- Outer Table Container -->
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width: 580px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #ffffff; border-collapse: collapse;">
    <tr>
      <td style="padding: 10px 0;">
        
        <!-- Main Card Border Container -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color: #ffffff; border: 1px solid #e0e0e0; border-radius: 6px; border-collapse: separate;">
          <tr>
            <td style="padding: 12px 16px;">
              
              <!-- Horizontal Main Row -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
                <tr>
                  
                  <!-- Left / Brand & Title -->
                  <td class="sig-column" valign="middle" style="padding-right: 12px;">
                    <div style="font-size: 13px; font-weight: 800; color: #000000; letter-spacing: -0.2px; line-height: 1.2; text-transform: uppercase;">
                      QUOTA HIRE
                    </div>
                    <div style="font-size: 11px; font-weight: 500; color: #555555; line-height: 1.3; margin-top: 2px;">
                      Info Desk &amp; Corporate Enquiries
                    </div>
                  </td>
                  
                  <!-- Middle / Contact Info (With Desktop Left Border Separator) -->
                  <td class="sig-column" valign="middle" style="padding-right: 12px; border-left: 1px solid #e0e0e0; padding-left: 12px;">
                    <div style="font-size: 11px; line-height: 1.4; color: #111111;">
                      <a href="mailto:info@quotahire.co.uk" style="color: #000000; font-weight: 600; text-decoration: none;">info@quotahire.co.uk</a>
                      <span style="color: #cccccc; margin: 0 4px;">&bull;</span>
                      <a href="https://www.quotahire.co.uk" target="_blank" style="color: #000000; font-weight: 600; text-decoration: none;">www.quotahire.co.uk</a>
                    </div>
                    <div style="font-size: 10px; color: #666666; margin-top: 2px;">
                      United Kingdom &bull; Mon - Fri (09:00 - 17:00 GMT)
                    </div>
                  </td>

                  <!-- Right / Green CTA Button -->
                  <td class="sig-column sig-align-right" valign="middle" align="right">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="display: inline-table;">
                      <tr>
                        <td style="background-color: #1A6515; border-radius: 4px; padding: 6px 12px;">
                          <a href="https://www.quotahire.co.uk/about" target="_blank" style="color: #ffffff; font-size: 11px; font-weight: 700; text-decoration: none; display: inline-block; white-space: nowrap; letter-spacing: 0.2px;">
                            LEARN MORE &rarr;
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>

                </tr>
              </table>

              <!-- Minimal Footer Disclaimer Line -->
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-top: 10px; border-top: 1px solid #f0f0f0; padding-top: 6px;">
                <tr>
                  <td style="font-size: 9px; line-height: 1.3; color: #888888;">
                    Registered in the UK. Confidentiality Notice: This message is intended for the named addressee.
                  </td>
                </tr>
              </table>

            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
