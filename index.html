    <!-- GitHub Pages SPA redirect handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- Facebook In-App Browser (FB_IAB) fix -->
    <!-- FB_IAB has a bug where it truncates large <script type="module"> bundles,
         causing "SyntaxError: Unexpected end of input". Redirect to system browser. -->
    <script type="text/javascript">
      (function() {
        var ua = navigator.userAgent || '';
        var isFBIAB = /FBAN|FBAV|FB_IAB|FB4A|FBIOS/i.test(ua);
        if (isFBIAB) {
          var url = window.location.href;
          // Android: intent scheme opens system browser
          var isAndroid = /Android/i.test(ua);
          if (isAndroid) {
            window.location.replace(
              'intent://' + url.replace(/^https?:\/\//, '') +
              '#Intent;scheme=https;package=com.android.chrome;end'
            );
          } else {
            // iOS: deep link to open in default browser
            window.location.replace(url);
          }
        }
      })();
    </script>
    <style>
      /* The site's own background, painted before any JavaScript runs so the
         first frame is not white.

         This must stay identical to the body::before gradient in index.css and
         must not touch `body`. An earlier version painted the splash's beige
         over html and body, which sat on top of the real background and showed
         through at the top of the page while scrolling.

         Inline CSS only: the Content-Security-Policy allows
         style-src 'unsafe-inline' but not inline script. */
      html { background: linear-gradient(135deg, #fffbeb 0%, #f4fbf2 100%); }
