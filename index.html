<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quotahire Recruiting Platform</title>
    <meta name="description" content="Quotahire is an AI-powered recruitment and career coaching platform connecting top talent with industry-leading companies." />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Open Graph / Facebook / LinkedIn Website Preview -->
    <meta property="og:site_name" content="Quotahire" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://quotahire.org/" />
    <meta property="og:title" content="Quotahire Recruiting Platform" />
    <meta property="og:description" content="Quotahire is an AI-powered recruitment and career coaching platform connecting top talent with industry-leading companies." />
    <meta property="og:image" content="https://quotahire.org/website-preview.png" />

    <!-- Twitter / X -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://quotahire.org/" />
    <meta property="twitter:title" content="Quotahire Recruiting Platform" />
    <meta property="twitter:description" content="Quotahire is an AI-powered recruitment and career coaching platform connecting top talent with industry-leading companies." />
    <meta property="twitter:image" content="https://quotahire.org/website-preview.png" />
    <!-- GitHub Pages SPA redirect handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- Facebook In-App Browser (FB_IAB) fix -->
    <!-- FB_IAB has a bug where it truncates large <script type="module"> bundles,
         causing "SyntaxError: Unexpected end of input". Redirect to system browser. -->
    <script type="text/javascript">
      (function() {
        var ua = navigator.userAgent || '';
        var isFBIAB = /FBAN|FBAV|FB_IAB|FB4A|FBIOS/i.test(ua);
        if (isFBIAB) {
          var url = window.location.href;
          // Android: intent scheme opens system browser
          var isAndroid = /Android/i.test(ua);
          if (isAndroid) {
            window.location.replace(
              'intent://' + url.replace(/^https?:\/\//, '') +
              '#Intent;scheme=https;package=com.android.chrome;end'
            );
          } else {
            // iOS: deep link to open in default browser
            window.location.replace(url);
          }
        }
      })();
    </script>
    <style>
      /* The opening animation's background, painted before any JavaScript has
         run, so the very first frame is the brand colour rather than white.
         Inline CSS only: the site's Content-Security-Policy allows
         style-src 'unsafe-inline' but not inline script. */
      html, body { background: linear-gradient(135deg, #EDEEDE 0%, #E2E1D4 100%); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
