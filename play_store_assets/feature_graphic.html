<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Feature Graphic - Quota Hire</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1024px;
    height: 500px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #e8f5e0 0%, #d2ecbf 40%, #c0e3aa 70%, #b0da98 100%);
    position: relative;
  }

  /* 3D cube decorations */
  .cube { position: absolute; border-radius: 12px; opacity: 0.55; }
  .cube-tl1 { width: 120px; height: 120px; background: linear-gradient(135deg, #a5d494, #76c162); top: -25px; left: -20px; transform: rotate(22deg); box-shadow: inset -5px -5px 14px rgba(0,0,0,0.15); }
  .cube-tl2 { width: 90px; height: 90px; background: linear-gradient(135deg, #bde5ae, #92d47e); top: 50px; left: 45px; transform: rotate(22deg); box-shadow: inset -4px -4px 10px rgba(0,0,0,0.12); }
  .cube-tr1 { width: 130px; height: 130px; background: linear-gradient(135deg, #9ed08e, #70bc5c); top: -30px; right: -22px; transform: rotate(-18deg); box-shadow: inset -5px -5px 14px rgba(0,0,0,0.15); }
  .cube-tr2 { width: 95px; height: 95px; background: linear-gradient(135deg, #c0e8b0, #96d884); top: 55px; right: 50px; transform: rotate(-18deg); box-shadow: inset -4px -4px 10px rgba(0,0,0,0.12); }
  .cube-bl1 { width: 140px; height: 140px; background: linear-gradient(135deg, #a0ce90, #6eba5c); bottom: -30px; left: -25px; transform: rotate(28deg); box-shadow: inset -5px -5px 14px rgba(0,0,0,0.15); }
  .cube-bl2 { width: 105px; height: 105px; background: linear-gradient(135deg, #b8e0a8, #8cce7a); bottom: 50px; left: 52px; transform: rotate(28deg); box-shadow: inset -4px -4px 10px rgba(0,0,0,0.12); }
  .cube-br1 { width: 150px; height: 150px; background: linear-gradient(135deg, #9cca8c, #68b658); bottom: -35px; right: -25px; transform: rotate(-22deg); box-shadow: inset -5px -5px 14px rgba(0,0,0,0.15); }
  .cube-br2 { width: 110px; height: 110px; background: linear-gradient(135deg, #badfac, #8ece7e); bottom: 52px; right: 55px; transform: rotate(-22deg); box-shadow: inset -4px -4px 10px rgba(0,0,0,0.12); }

  /* Left text block */
  .left-content {
    position: absolute;
    left: 60px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    width: 380px;
  }
  .left-content h1 {
    font-size: 62px;
    font-weight: 900;
    color: #111;
    line-height: 1.05;
    letter-spacing: -1.5px;
    text-transform: uppercase;
    margin-bottom: 0;
  }

  /* Phone mockup - right side */
  .phone-wrap {
    position: absolute;
    right: 80px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 20;
  }
  .phone-frame {
    width: 210px;
    height: 430px;
    background: #111;
    border-radius: 30px;
    padding: 8px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.4), 0 10px 30px rgba(0,0,0,0.25), inset 0 0 0 1.5px #333;
    position: relative;
    transform: rotate(-5deg);
  }
  .phone-notch {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 14px;
    background: #111;
    border-radius: 0 0 8px 8px;
    z-index: 30;
  }
  .phone-screen {
    width: 100%;
    height: 100%;
    border-radius: 22px;
    overflow: hidden;
    background: #f5f0e8;
  }
  .screen-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }

  /* Bottom right sub-text */
  .bottom-right-text {
    position: absolute;
    bottom: 40px;
    right: 330px;
    z-index: 10;
    text-align: right;
  }
  .bottom-right-text p {
    font-size: 22px;
    font-weight: 800;
    color: #1a1a1a;
    line-height: 1.2;
    text-transform: uppercase;
    letter-spacing: -0.5px;
    opacity: 0.85;
  }
</style>
</head>
<body>
  <div class="cube cube-tl1"></div>
  <div class="cube cube-tl2"></div>
  <div class="cube cube-tr1"></div>
  <div class="cube cube-tr2"></div>
  <div class="cube cube-bl1"></div>
  <div class="cube cube-bl2"></div>
  <div class="cube cube-br1"></div>
  <div class="cube cube-br2"></div>

  <div class="left-content">
    <h1>UNLOCK<br>YOUR<br>CAREER<br>SUCCESS</h1>
  </div>

  <div class="bottom-right-text">
    <p>FROM CV GENERATION<br>TO INTERVIEW WINS.</p>
  </div>

  <div class="phone-wrap">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <img class="screen-img" src="Screenshot_2026-08-11-19-26-37-07_e66e5bc39d7a66a7069feea54c79b99c.jpg" alt="Quota Hire App">
      </div>
    </div>
  </div>
</body>
</html>
