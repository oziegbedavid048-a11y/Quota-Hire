<!DOCTYPE html>
<html lang="en">
<head>

<title>Phone Screenshot 1 - Quota Hire</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(145deg, #e8f5e0 0%, #d4edca 30%, #c5e8b8 60%, #b8e0aa 100%);
    position: relative;
  }
  .cube {
    position: absolute;
    border-radius: 18px;
    opacity: 0.55;
  }
  .cube-1 { width: 200px; height: 200px; background: linear-gradient(135deg, #a8d89a, #7ec86a); top: -40px; left: -40px; transform: rotate(20deg); box-shadow: inset -8px -8px 20px rgba(0,0,0,0.15); }
  .cube-2 { width: 160px; height: 160px; background: linear-gradient(135deg, #c5e8b8, #9dd988); top: 80px; left: 60px; transform: rotate(20deg); box-shadow: inset -6px -6px 16px rgba(0,0,0,0.12); }
  .cube-3 { width: 220px; height: 220px; background: linear-gradient(135deg, #b2dba2, #85c972); top: -60px; right: -30px; transform: rotate(-15deg); box-shadow: inset -8px -8px 20px rgba(0,0,0,0.15); }
  .cube-4 { width: 180px; height: 180px; background: linear-gradient(135deg, #caefc0, #a3dc90); top: 100px; right: 50px; transform: rotate(-15deg); box-shadow: inset -6px -6px 16px rgba(0,0,0,0.12); }
  .cube-5 { width: 240px; height: 240px; background: linear-gradient(135deg, #a8d89a, #78c268); bottom: -50px; left: -50px; transform: rotate(25deg); box-shadow: inset -10px -10px 24px rgba(0,0,0,0.15); }
  .cube-6 { width: 200px; height: 200px; background: linear-gradient(135deg, #b8e0aa, #8ed07c); bottom: 60px; left: 60px; transform: rotate(25deg); box-shadow: inset -6px -6px 16px rgba(0,0,0,0.12); }
  .cube-7 { width: 260px; height: 260px; background: linear-gradient(135deg, #a0d490, #6ebf5c); bottom: -70px; right: -50px; transform: rotate(-20deg); box-shadow: inset -10px -10px 24px rgba(0,0,0,0.15); }
  .cube-8 { width: 200px; height: 200px; background: linear-gradient(135deg, #c0e8b0, #95d882); bottom: 80px; right: 50px; transform: rotate(-20deg); box-shadow: inset -6px -6px 16px rgba(0,0,0,0.12); }

  .top-text { position: absolute; top: 110px; left: 70px; z-index: 10; }
  .top-text h1 { font-size: 88px; font-weight: 900; color: #1a1a1a; line-height: 1.05; letter-spacing: -2px; text-transform: uppercase; }

  .phone-wrap { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -48%); z-index: 20; }
  .phone-frame { width: 580px; height: 1180px; background: #111; border-radius: 66px; padding: 18px; box-shadow: 0 60px 120px rgba(0,0,0,0.45), 0 20px 40px rgba(0,0,0,0.3), inset 0 0 0 2px #333; position: relative; }
  .phone-notch { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); width: 160px; height: 36px; background: #111; border-radius: 0 0 20px 20px; z-index: 30; }
  .phone-screen { width: 100%; height: 100%; border-radius: 50px; overflow: hidden; background: #f5f0e8; position: relative; }
  .screen-img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }

  .bottom-text { position: absolute; bottom: 110px; right: 70px; z-index: 10; text-align: right; }
  .bottom-text p { font-size: 52px; font-weight: 800; color: #1a1a1a; line-height: 1.15; text-transform: uppercase; letter-spacing: -1px; }
</style>

<body>
  <div class="cube cube-1"></div>

  <div class="phone-wrap">
    <div class="phone-frame">
      <div class="phone-notch"></div>
      <div class="phone-screen">
        <img class="screen-img" src="Screenshot_2026-08-11-19-26-37-07_e66e5bc39d7a66a7069feea54c79b99c.jpg" alt="Quota Hire Profile Screen">
